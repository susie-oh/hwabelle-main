name: Daily Hwabelle SEO Auto-Blog

on:
  schedule:
    # Runs daily at 01:00 UTC (9:00 AM PHT)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  trigger-auto-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Hwabelle Auto-Blog Edge Function
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ryeviupygrrmoyxoycwl.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTO_BLOG_SECRET: ${{ secrets.AUTO_BLOG_SECRET }}
        run: |
          AUTH_TOKEN="${AUTO_BLOG_SECRET:-$SUPABASE_SERVICE_ROLE_KEY}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SUPABASE_URL}/functions/v1/auto-blog" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -d '{"source":"github_actions","force":true}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Response ($HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi

